<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CCGD Quotes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="description" content="Cleveland County Garage Doors dealer quotes. Saved on this phone.">
  <title>CCGD Dealer Quotes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="intro" role="button" tabindex="0" aria-label="Tap to open the garage door">
    <div class="jamb jamb-left" aria-hidden="true"></div>
    <div class="jamb jamb-right" aria-hidden="true"></div>
    <div class="door-lintel" aria-hidden="true"></div>
    <div class="door-opening">
      <div class="door-slab" id="door-slab">
        <div class="section s1"><i></i><i></i><i></i><i></i></div>
        <div class="section s2"><i></i><i></i><i></i><i></i></div>
        <div class="section s3"><i></i><i></i><i></i><i></i></div>
        <div class="section s4">
          <i></i><i></i><i></i><i></i>
          <span class="t-bar"></span>
          <span class="t-knob"></span>
          <span class="lift left"></span>
          <span class="lift right"></span>
        </div>
        <div class="weather-seal"></div>
        <div class="door-sheen" aria-hidden="true"></div>
        <div class="door-brand">
          <img src="assets/logo.png" alt="Cleveland County Garage Doors">
          <div class="splash-tag">
            <span class="splash-rule"></span>
            <span class="splash-words">Matt needs a pay raise</span>
            <span class="splash-rule splash-rule-right"></span>
          </div>
          <div class="tap-hint" id="tap-hint">
            <div class="wall-panel" aria-hidden="true">
              <div class="wp-opener">
                <span class="wp-tick left"></span>
                <span class="wp-tick right"></span>
                <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3.5 11 L12 3.8 L20.5 11 V20.5 H3.5 Z" fill="none" stroke="#ffc433" stroke-width="1.7" stroke-linejoin="round"></path>
                  <rect x="7" y="11.5" width="10" height="7.8" fill="rgba(255,196,51,0.18)" stroke="#ffc433" stroke-width="1.3"></rect>
                  <line x1="7" y1="14.1" x2="17" y2="14.1" stroke="#ffc433" stroke-width="1.1"></line>
                  <line x1="7" y1="16.7" x2="17" y2="16.7" stroke="#ffc433" stroke-width="1.1"></line>
                </svg>
              </div>
              <div class="wp-sensor"></div>
              <div class="wp-light">
                <span class="wp-dot left"></span>
                <span class="wp-dot right"></span>
                <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 4 a5.5 5.5 0 0 0 -3.2 10 c0.6 0.5 0.9 1.1 0.9 1.9 h4.6 c0 -0.8 0.3 -1.4 0.9 -1.9 A5.5 5.5 0 0 0 12 4 Z M9.8 18.3 h4.4 M10.6 20.6 h2.8 M12 1 v1.3 M4.3 4.3 l0.9 0.9 M19.7 4.3 l-0.9 0.9 M1.5 11 h1.3 M21.2 11 h1.3" fill="none" stroke="#8c8c91" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </div>
              <div class="wp-mark">CCGD</div>
            </div>
            <div class="tap-caption">Press the lit button</div>
          </div>
        </div>
      </div>
    </div>
    <div class="leaf-layer" id="leaf-layer" aria-hidden="true"></div>
  </div>

  <div id="app" hidden>
    <header class="top">
      <img src="assets/logo.png" alt="">
      <div class="top-copy">
        <strong>Cleveland County Garage Doors</strong>
        <a href="tel:7044729367">704-472-9367</a>
      </div>
      <button class="icon-btn" type="button" data-action="replay" aria-label="Show the opening door">Door</button>
    </header>
    <div id="storage-banner" class="banner" hidden></div>
    <main id="view"></main>
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-action="tab" data-tab="quote">Quote</button>
      <button type="button" data-action="tab" data-tab="book">Price book</button>
      <button type="button" data-action="tab" data-tab="estimate">Estimate</button>
      <button type="button" data-action="tab" data-tab="schedule">Schedule</button>
      <button type="button" data-action="tab" data-tab="send">Send</button>
    </nav>
  </div>

  <article id="quote-sheet" class="sheet" aria-live="polite"></article>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title"></h2>
      <p id="modal-body"></p>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <noscript>
    <p class="banner">Turn on JavaScript. This page runs by itself in the browser so quotes can stay on the phone.</p>
  </noscript>
  <script src="js/prices.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
